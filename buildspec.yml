# CodeBuild spec for the demo app. Phase 1 increment 3.
#
# This build does something slightly unusual: it produces an artifact that IS
# the Lambda deployment package, rather than a package containing one.
# `base-directory` below makes CodePipeline's output zip contain handler.py at
# its root, which is exactly the layout Lambda expects. The executor can then
# hand those bytes straight to UpdateFunctionCode with no unpacking step and no
# nested-zip confusion.
#
# The build also runs the full test suite and linter. That is not ceremony: the
# gate in the next stage is about to decide whether this change is safe, and a
# change that does not compile or pass its own tests should never get as far as
# being judged on its risk.

version: 0.2

env:
  # Phase 2.2. CodeBuild hands these back to CodePipeline as action output
  # variables, and the Gate action interpolates them into its UserParameters.
  #
  # This is why the gate needs no artifact download, no S3 read and no git
  # access of its own: the facts travel as pipeline variables. The payload is
  # base64 precisely so that a commit message containing a quote cannot break
  # the UserParameters JSON it lands in -- see services/decision_service/
  # signals/change_context.py for why that matters more than it looks.
  exported-variables:
    - CHANGE_CONTEXT_B64

phases:
  install:
    runtime-versions:
      # Pinned to 3.12 because pyproject requires >=3.12 and 3.12 is present in
      # the amazonlinux-aarch64-standard:3.0 image. The Lambda runtime is 3.13 --
      # the mismatch is deliberate and harmless, since the build only lints,
      # tests and zips a single dependency-free file. It never compiles anything
      # that has to match the runtime.
      #
      # If this ever fails with "Unknown runtime version", this line is the fix:
      # check `aws codebuild list-curated-environment-images` for what the image
      # actually ships.
      python: 3.12

  pre_build:
    commands:
      - python --version
      - python -m pip install --quiet --upgrade pip
      - python -m pip install --quiet -e ".[dev]"

  build:
    commands:
      - echo "Building commit ${CODEBUILD_RESOLVED_SOURCE_VERSION}"
      - python -m ruff check .
      - python -m ruff format --check .
      - python -m pytest

      # Collect the change context the gate will judge. Deliberately AFTER the
      # tests: a change that cannot pass its own test suite should never reach
      # the gate to be assessed on risk.
      #
      # `|| true` is intentional and narrow in effect. If this script fails
      # outright the variable stays empty, CodePipeline interpolates an empty
      # string, and the collector fails closed on a missing payload -- which
      # routes to human review. Failing the BUILD instead would be a worse
      # outcome: a signal-collection bug would block every deploy in the account
      # rather than degrading one verdict to human judgement.
      - export CHANGE_CONTEXT_B64="$(python scripts/build_change_context.py || true)"
      - echo "change context is ${#CHANGE_CONTEXT_B64} base64 chars"

artifacts:
  # The two lines that make the artifact a valid Lambda package. Change these
  # and the executor's UpdateFunctionCode call starts failing with an unhelpful
  # "Unzipped size must be smaller than..." or a missing-handler error at
  # runtime.
  base-directory: services/demo_app
  files:
    # Every module, not just the entrypoint. This was `handler.py` alone until
    # Phase 2.5 added faults.py, at which point a deploy would have produced a
    # Lambda that import-errors on its first invocation -- after CodeDeploy had
    # already begun shifting traffic to it.
    #
    # A glob rather than a list because the failure mode of forgetting to add a
    # file here is a runtime ImportError in production, which is a bad way to
    # find out about a packaging decision.
    - '**/*.py'
    - '!__pycache__/**'
